# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NUGET_DIRECTORY: ${{ github.workspace }}/artifacts/nuget
  TEST_RESULTS_DIRECTORY: ${{ github.workspace }}/artifacts/test-results
  DOTNET_CLI_DISABLE_PERSISTENT_MSBUILD_SERVER: true

defaults:
  run:
    shell: pwsh

jobs:
  build-test-pack:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create version number
        id: version
        run: |
          "value=$(Get-Date -Format 'yyyy.M.d.HHmm')" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore src/cCoder.ClientRelationshipManagement.sln --no-http-cache

      - name: Build
        run: dotnet build src/cCoder.ClientRelationshipManagement.sln -c Release --no-restore -m:1 /p:BuildInParallel=false /p:UseSharedCompilation=false /p:Version="${{ steps.version.outputs.value }}"

      - name: Test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: dotnet test src/cCoder.ClientRelationshipManagement.sln -c Release --no-build -m:1 /p:BuildInParallel=false /p:UseSharedCompilation=false

      - name: Test and collect coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet test src/cCoder.ClientRelationshipManagement.sln -c Release --no-build -m:1 /p:BuildInParallel=false /p:UseSharedCompilation=false --settings src/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory "${{ env.TEST_RESULTS_DIRECTORY }}" --logger trx

      - name: Upload test and coverage results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          if-no-files-found: error
          retention-days: 30
          path: ${{ env.TEST_RESULTS_DIRECTORY }}

      - name: Pack
        run: |
          New-Item -ItemType Directory -Path "${{ env.NUGET_DIRECTORY }}" -Force | Out-Null
          dotnet pack src/cCoder.ClientRelationshipManagement/cCoder.ClientRelationshipManagement.csproj -c Release --no-build --output "${{ env.NUGET_DIRECTORY }}" /p:Version="${{ steps.version.outputs.value }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.NUGET_DIRECTORY }}/*.nupkg
            !${{ env.NUGET_DIRECTORY }}/*.snupkg

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test-pack
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.NUGET_DIRECTORY }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        run: |
          foreach ($file in (Get-ChildItem "${{ env.NUGET_DIRECTORY }}" -Filter *.nupkg)) {
            dotnet nuget push $file.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

  coverage-report:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test-pack
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Download coverage results
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: test-results

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Generate coverage report
        run: |
          dotnet tool install --tool-path tools dotnet-reportgenerator-globaltool --version 5.5.10
          tools/reportgenerator \
            -reports:"test-results/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;Cobertura;MarkdownSummaryGithub"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          touch coverage-report/.nojekyll

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: coverage-report
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: coverage-report

      - name: Deploy coverage report
        id: deployment
        uses: actions/deploy-pages@v4
